# FILE: pyproject.toml
# VERSION: 1.0.0
# START_MODULE_CONTRACT
#   PURPOSE: Define uv's reproducible Python dependency surface for the GPU packaging environment.
#   SCOPE: Python runtime dependencies, CUDA torch source pinning, uv resolver configuration.
#   DEPENDS: backend/requirements.txt, M-PACKAGING
#   LINKS: M-PACKAGING, V-M-PACKAGING
#   ROLE: CONFIG
#   MAP_MODE: NONE
# END_MODULE_CONTRACT
#
# START_CHANGE_SUMMARY
#   LAST_CHANGE: v1.0.0 - Added uv project metadata so V-M-PACKAGING can run uv sync with cu124 torch sources.
# END_CHANGE_SUMMARY

[project]
name = "whisperannote-backend"
version = "0.2.0"
description = "WhisperAnnote packaged Python backend runtime"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.30,<1.0",
  "pydantic>=2.7,<3.0",
  "python-multipart>=0.0.9",
  "torch==2.6.0",
  "torchaudio==2.6.0",
  "faster-whisper>=1.1.0",
  "ctranslate2>=4.5.0",
  "pyannote.audio>=3.3.0",
  "huggingface_hub>=0.24",
  "nvidia-cudnn-cu12>=9.0",
  "nvidia-cublas-cu12>=12.0",
  "python-docx>=1.1.0"
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
